# GuardianRS Default Configuration
# Copy to configs/guardian.yaml and adjust as needed.

daemon:
  poll_interval_secs: 30

thresholds:
  cpu_warning: 80
  cpu_critical: 95
  memory_warning: 85
  memory_critical: 95
  disk_warning: 80
  disk_critical: 90
  temp_warning: 70
  temp_critical: 80

# Reading the Docker socket makes this user a member of the docker group, which is
# root-equivalent. A hardened host leaves it off.
docker:
  enabled: false

notification:
  discord:
    enabled: true
    webhook_url_env: DISCORD_WEBHOOK_URL

# Health probe. The connection is shared with maintenance, so it is written once.
postgres:
  enabled: true
  host: "127.0.0.1"
  port: 5442
  database: "auditor_familiar"
  user: "Gallinal2218"
  password_env: "GUARDIAN_PG_PASSWORD"

# Constructive maintenance only: this daemon backs up, it never deletes.
maintenance:
  enabled: true
  # Without this the record lives in memory and every restart re-runs the backup.
  state_path: "/var/lib/guardianrs/state.json"
  tasks:
    - name: auditor_familiar_nightly
      kind: postgres_backup
      daily_at: "03:30"
      database: "auditor_familiar"
