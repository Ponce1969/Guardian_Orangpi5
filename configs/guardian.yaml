# GuardianRS configuration.
#
# Everything operational lives here; secrets live in /opt/guardianrs/.env and this
# file names the variables, never the values.

daemon:
  poll_interval_secs: 30
  # After a host reboot the databases are still starting. Alerts are not evaluated
  # during this window; collection continues, and a real outage is reported when it
  # ends rather than lost.
  startup_grace_secs: 180

thresholds:
  cpu_warning: 80
  cpu_critical: 95
  memory_warning: 85
  memory_critical: 95
  disk_warning: 80
  disk_critical: 90
  temp_warning: 70
  temp_critical: 80

# Reading the Docker socket makes the service user a member of the docker group,
# which is root-equivalent, so a hardened host leaves this off.
docker:
  enabled: false

notification:
  discord:
    enabled: true
    webhook_url_env: DISCORD_WEBHOOK_URL

# One entry per database to watch. `name` is what alerts say, so use the project.
# `host` is explicit with no default on purpose: this decides a network destination,
# and an implicit destination is one nobody reviewed.
postgres:
  enabled: true
  instances:
    - name: auditor
      host: "127.0.0.1"
      port: 5442
      database: "auditor_familiar"
      user: "Gallinal2218"
      password_env: "GUARDIAN_PG_AUDITOR_PASSWORD"

    - name: pedidos
      host: "127.0.0.1"
      port: 5445
      database: "barraca"
      user: "barraca_user"
      password_env: "GUARDIAN_PG_PEDIDOS_PASSWORD"

    - name: ecommerce
      host: "127.0.0.1"
      port: 5446
      database: "web_2r_prod"
      user: "web2r_prod_user"
      password_env: "GUARDIAN_PG_ECOMMERCE_PASSWORD"

    - name: nutrition
      host: "127.0.0.1"
      port: 5438
      database: "nutrition_udelar"
      user: "nutrition_app"
      password_env: "GUARDIAN_PG_NUTRITION_PASSWORD"

maintenance:
  enabled: true
  # Without this the record lives in memory and every restart re-runs the backups.
  state_path: "/var/lib/guardianrs/state.json"
  tasks:
    # Staggered on purpose: the scheduler runs one task per tick, so four tasks due
    # at the same instant would pile their dumps into one I/O window.
    - name: auditor_nightly
      kind: postgres_backup
      daily_at: "03:30"
      instance: auditor

    - name: pedidos_nightly
      kind: postgres_backup
      daily_at: "03:35"
      instance: pedidos

    - name: ecommerce_nightly
      kind: postgres_backup
      daily_at: "03:40"
      instance: ecommerce

    - name: nutrition_nightly
      kind: postgres_backup
      daily_at: "03:45"
      instance: nutrition

# Human liveness digest (`I4.2`), separate from the 03:30-03:45 machine backup window.
# Evaluates in host local time; set `enabled: false` explicitly to opt out.
digest:
  enabled: true
  daily_at: "08:00"
