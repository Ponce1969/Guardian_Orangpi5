# GuardianRS Default Configuration
# Copy to configs/guardian.yaml and adjust as needed.

daemon:
  poll_interval_secs: 30

thresholds:
  cpu_warning: 80
  cpu_critical: 95
  memory_warning: 85
  memory_critical: 95
  disk_warning: 80
  disk_critical: 90
  temp_warning: 70
  temp_critical: 80
  # Network throughput in MB/s, aggregated over physical interfaces only.
  # A 1 GbE link saturates near 119 MB/s, so these fire before saturation.
  network_warning: 80
  network_critical: 110
  # Docker: unhealthy means a failing healthcheck or a container stuck
  # restarting. A container that exited after finishing its job is not counted.
  docker_unhealthy_warning: 1
  docker_unhealthy_critical: 2
  # Total Docker disk usage in GB (images + containers + volumes + build cache).
  docker_disk_warning: 40
  docker_disk_critical: 80

notification:
  discord:
    enabled: true
    webhook_url_env: DISCORD_WEBHOOK_URL
